<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order | Saanjh Beauty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="result.js" defer></script>
</head>
<body>
  <header class="bar"><div class="wrap"><a class="logo" href="index.html" style="color:inherit;text-decoration:none">Saanjh<i>.</i></a><a class="link" href="index.html#shop">Shop</a></div></header>
  <main class="wrap page-main">
    <section class="panel status-card" aria-live="polite" aria-busy="true" id="status-card">
      <div class="status-icon" id="status-icon" aria-hidden="true">…</div>
      <h1 class="page-title" id="status-title">Checking your order</h1>
      <p class="page-lead" id="status-message">Please wait while we confirm the latest order status.</p>
      <div class="summary-list" id="receipt-items"></div>
      <div class="summary-totals" id="receipt-totals" hidden>
        <div class="summary-row"><span>Subtotal</span><span id="receipt-subtotal"></span></div>
        <div class="summary-row"><span>Shipping</span><span>Free</span></div>
        <div class="summary-row total-row"><span>Total (includes GST)</span><span id="receipt-total"></span></div>
      </div>
      <p class="muted" id="delivery"></p>
      <p class="form-error" id="receipt-error" role="alert"></p>
      <div class="cta-row" style="justify-content:center;margin-top:20px">
        <a class="btn" id="retry" href="checkout.html" hidden>Retry checkout</a>
        <a class="link" href="index.html">Return to shop</a>
      </div>
    </section>
  </main>
  <footer><div class="wrap"><span>© 2026 Saanjh Beauty</span><nav aria-label="Policies" class="footer-links"><a href="shipping.html">Shipping</a><a href="returns.html">Returns &amp; refunds</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a><a href="contact.html">Contact</a></nav></div></footer>
</body>
</html>
